name: FOSSA License Scan

on:
  push:
    branches: [ main, sam, pooja, nithya ]
  pull_request:
    branches: [ main, sam, pooja, nithya ]

jobs:
  fossa-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Run FOSSA scan (will not fail workflow if it errors)
      - name: Run FOSSA scan
        uses: fossas/fossa-action@v1
        continue-on-error: true   # <- this prevents failure on project limit or warnings
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

      # Step 3: Upload FOSSA results if available
      - name: Upload FOSSA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fossa-report
          path: .fossa/
